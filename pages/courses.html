<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  try {
    var t = localStorage.getItem("nexora-theme");
    if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
})();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" data-institute-favicon href="favicon.png" />
<title>Courses | {{INSTITUTE_NAME}}</title>
<meta name="description" content="Browse 20+ practical courses across Communication, Career, Technology, Data & AI and Personal Development at {{INSTITUTE_NAME}}." />
<link rel="canonical" href="#" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero container">
    <div class="breadcrumb"><a href="../index.html">Home</a> / Courses</div>
    <h1>Explore Our Courses</h1>
    <p class="lede">Search or filter by category, duration, level and price to find the right course for you.</p>
  </section>

  <section class="section" style="border-top:none; padding-top:0;">
    <div class="container">
      <div class="filter-bar" data-filter-bar>
        <div class="filter-row">
          <div class="search-input-wrap">
            <i data-lucide="search" width="18" height="18"></i>
            <input class="form-control" type="text" placeholder="Search courses..." data-course-search aria-label="Search courses" />
          </div>
          <select class="form-control" data-filter-category aria-label="Filter by category">
            <option value="">All Categories</option>
          </select>
          <select class="form-control" data-filter-duration aria-label="Filter by duration">
            <option value="">Any Duration</option>
            <option value="1">1 Month</option>
            <option value="3">3 Months</option>
            <option value="6">6 Months</option>
            <option value="11">11 Months</option>
          </select>
          <select class="form-control" data-filter-level aria-label="Filter by level">
            <option value="">Any Level</option>
            <option value="FOUNDATION">Foundation</option>
            <option value="PROFESSIONAL">Professional</option>
            <option value="ADVANCED">Advanced</option>
            <option value="CAREER_PROGRAM">Career Program</option>
          </select>
        </div>
        <div class="filter-row" style="grid-template-columns: 1fr; margin-top:1rem;">
          <select class="form-control" data-filter-price aria-label="Filter by price range" style="max-width:260px;">
            <option value="">Any Price Range</option>
            <option value="low">Under ₹10,000</option>
            <option value="mid">₹10,000 – ₹40,000</option>
            <option value="high">Above ₹40,000</option>
          </select>
        </div>
      </div>

      <p class="filter-results-meta" data-filter-results>Showing all courses</p>

      <div class="grid grid-3" data-course-grid></div>
      <div class="empty-state hidden" data-empty-state>
        <i data-lucide="search-x" width="32" height="32"></i>
        <h3>No courses match your filters</h3>
        <p>Try adjusting your search or filters.</p>
      </div>
    </div>
  </section>
</main>

<div id="site-footer"></div>





<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/main.js"></script>
<script src="../js/courses.js"></script>
<script src="../js/forms.js"></script>
</body>
</html>
