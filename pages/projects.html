<!DOCTYPE html>
<html lang="en">
<head>
<script>
(function () {
  try {
    var t = localStorage.getItem("nexora-theme");
    if (!t && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) t = "dark";
    if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
  } catch (e) {}
})();
</script>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="icon" data-institute-favicon href="favicon.png" />
<title>Student Projects | {{INSTITUTE_NAME}}</title>
<meta name="description" content="Example projects built across Data Analytics, Data Science, Web Development and Python at {{INSTITUTE_NAME}}." />
<link rel="canonical" href="#" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="../css/style.css" />
<link rel="stylesheet" href="../css/responsive.css" />
</head>
<body>

<div id="site-header"></div>

<main>
  <section class="page-hero container">
    <div class="breadcrumb"><a href="../index.html">Home</a> / Projects</div>
    <h1>What You Could Build Here</h1>
    <p class="lede">Example project types used across our Data Analytics, Data Science, Web Development and Python courses.</p>
  </section>

  <section class="section" style="border-top:none; padding-top:0;">
    <div class="container">
      <div class="flex gap-sm flex-wrap" style="margin-bottom:2rem;" data-project-filters>
        <button class="btn btn-outline btn-sm is-active" data-project-filter="">All</button>
        <button class="btn btn-outline btn-sm" data-project-filter="Data Analytics">Data Analytics</button>
        <button class="btn btn-outline btn-sm" data-project-filter="Data Science">Data Science</button>
        <button class="btn btn-outline btn-sm" data-project-filter="Web Development">Web Development</button>
        <button class="btn btn-outline btn-sm" data-project-filter="Python">Python</button>
      </div>
      <div class="grid grid-3" data-projects-grid></div>
    </div>
  </section>
</main>

<div id="site-footer"></div>



<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
<script src="../js/config.js"></script>
<script src="../js/data.js"></script>
<script src="../js/components.js"></script>
<script src="../js/main.js"></script>
<script src="../js/forms.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const buttons = document.querySelectorAll("[data-project-filter]");
    buttons.forEach((btn) => {
      btn.addEventListener("click", () => {
        buttons.forEach((b) => b.classList.remove("is-active", "btn-outline"));
        buttons.forEach((b) => b.classList.add("btn-outline"));
        btn.classList.add("is-active");
        renderProjectsFiltered(btn.getAttribute("data-project-filter"));
      });
    });
    function renderProjectsFiltered(cat) {
      const mount = document.querySelector("[data-projects-grid]");
      const list = cat ? projects.filter((p) => p.category === cat) : projects;
      mount.innerHTML = list.map((p) => `
        <div class="card reveal is-visible">
          <div class="trainer-photo" style="aspect-ratio:16/10;">
            <img class="trainer-photo-img" src="../assets/images/projects/${p.id}.jpg" alt="${p.title} — ${p.category} project" loading="lazy" onerror="this.style.display='none'" />
            <span class="trainer-initials" style="font-size:0.85rem; color:var(--muted); font-family:var(--font-body);">${p.category}</span>
          </div>
          <span class="chip" style="margin-bottom:0.6rem; display:inline-block;">${p.tech}</span>
          <h4>${p.title}</h4>
          <p class="text-muted" style="font-size:0.88rem;">${p.description}</p>
        </div>`).join("");
    }
  });
</script>
</body>
</html>
